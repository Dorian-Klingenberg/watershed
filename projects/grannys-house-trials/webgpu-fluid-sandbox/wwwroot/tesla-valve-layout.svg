<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 850" role="img" aria-labelledby="title desc">
  <title id="title">Top-down Tesla-valve layout proposal on the sandbox grid</title>
  <desc id="desc">A scaled plan on a 96 by 64 cell grid, with one foot per cell. A straight four-cell main passage connects end reservoirs. Six overlapping hooked return passages alternate above and below the main route. The proposal uses shallow diagonal necks and a 15 to 25 degree angle sweep for later tests. It is not yet simulated.</desc>
  <defs>
    <pattern id="minor-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#d8dfdf" stroke-width=".55"/>
    </pattern>
    <pattern id="major-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#aebcbe" stroke-width="1"/>
    </pattern>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#087e83"/>
    </marker>
    <marker id="dim-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#385253"/>
    </marker>
  </defs>
  <rect width="1220" height="850" fill="#f7faf8"/>
  <text x="100" y="34" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#153433">TESLA VALVE · TOP-DOWN GRID PLAN</text>
  <text x="100" y="58" font-family="system-ui, sans-serif" font-size="14" fill="#48605f">Proposed raster geometry · application field 96 × 64 cells · 1 cell = 1 ft · 48-in banks shown dark</text>

  <!-- Field bounds: (100,90) to (1060,730), 10 screen units per application cell. -->
  <rect x="100" y="90" width="960" height="640" fill="#eee9d8"/>
  <rect x="100" y="90" width="960" height="640" fill="url(#minor-grid)"/>
  <rect x="100" y="90" width="960" height="640" fill="url(#major-grid)"/>
  <rect x="100" y="90" width="960" height="640" fill="none" stroke="#3b5050" stroke-width="2"/>

  <!-- Reservoirs and straight main passage. Dark outlines are banks; pale blue is open waterway. -->
  <g transform="translate(100 90) scale(10)">
    <rect x="3" y="28" width="12" height="8" rx="1" fill="#acd9dc" stroke="#293c3e" stroke-width=".4"/>
    <rect x="81" y="28" width="12" height="8" rx="1" fill="#acd9dc" stroke="#293c3e" stroke-width=".4"/>
    <path d="M3 30H93V34H3Z" fill="#acd9dc" stroke="#293c3e" stroke-width=".4"/>

    <!-- Six re-entrant return cells. They overlap in longitudinal pitch and alternate sides. -->
    <g fill="none" stroke="#293c3e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 32 C16 32 17 31 19 30 L22 28 C25 26.5 28 26.5 30 28 C32 29.5 30.5 31 28.5 30 L25 28.5 C23 28 22 30 25 32"/>
      <path d="M25 32 C27 32 28 33 30 34 L33 36 C36 37.5 39 37.5 41 36 C43 34.5 41.5 33 39.5 34 L36 35.5 C34 36 33 34 36 32"/>
      <path d="M36 32 C38 32 39 31 41 30 L44 28 C47 26.5 50 26.5 52 28 C54 29.5 52.5 31 50.5 30 L47 28.5 C45 28 44 30 47 32"/>
      <path d="M47 32 C49 32 50 33 52 34 L55 36 C58 37.5 61 37.5 63 36 C65 34.5 63.5 33 61.5 34 L58 35.5 C56 36 55 34 58 32"/>
      <path d="M58 32 C60 32 61 31 63 30 L66 28 C69 26.5 72 26.5 74 28 C76 29.5 74.5 31 72.5 30 L69 28.5 C67 28 66 30 69 32"/>
      <path d="M69 32 C71 32 72 33 74 34 L77 36 C80 37.5 83 37.5 85 36 C87 34.5 85.5 33 83.5 34 L80 35.5 C78 36 77 34 80 32"/>
    </g>
    <g fill="none" stroke="#acd9dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 32 C16 32 17 31 19 30 L22 28 C25 26.5 28 26.5 30 28 C32 29.5 30.5 31 28.5 30 L25 28.5 C23 28 22 30 25 32"/>
      <path d="M25 32 C27 32 28 33 30 34 L33 36 C36 37.5 39 37.5 41 36 C43 34.5 41.5 33 39.5 34 L36 35.5 C34 36 33 34 36 32"/>
      <path d="M36 32 C38 32 39 31 41 30 L44 28 C47 26.5 50 26.5 52 28 C54 29.5 52.5 31 50.5 30 L47 28.5 C45 28 44 30 47 32"/>
      <path d="M47 32 C49 32 50 33 52 34 L55 36 C58 37.5 61 37.5 63 36 C65 34.5 63.5 33 61.5 34 L58 35.5 C56 36 55 34 58 32"/>
      <path d="M58 32 C60 32 61 31 63 30 L66 28 C69 26.5 72 26.5 74 28 C76 29.5 74.5 31 72.5 30 L69 28.5 C67 28 66 30 69 32"/>
      <path d="M69 32 C71 32 72 33 74 34 L77 36 C80 37.5 83 37.5 85 36 C87 34.5 85.5 33 83.5 34 L80 35.5 C78 36 77 34 80 32"/>
    </g>

    <!-- The arrows identify test direction only; they are not simulated streamlines. -->
    <path d="M5 32H12" stroke="#087e83" stroke-width=".35" marker-end="url(#flow-arrow)"/>
    <path d="M91 33.4H84" stroke="#b95b32" stroke-width=".35" marker-end="url(#flow-arrow)"/>

    <!-- Approximate angle marker at first oblique neck. -->
    <path d="M19 31.75L27 29.1" fill="none" stroke="#bc5b32" stroke-width=".22" stroke-dasharray=".45 .35"/>
    <path d="M19 31.75H24" fill="none" stroke="#385253" stroke-width=".18"/>
    <path d="M23.6 31.75 A4.6 4.6 0 0 0 23.4 30.3" fill="none" stroke="#385253" stroke-width=".18"/>
  </g>

  <!-- Dimension lines, cell coordinates are shown on the outer grid. -->
  <path d="M240 505V555 M970 505V555 M240 548H970" fill="none" stroke="#385253" stroke-width="1.5" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>
  <rect x="546" y="535" width="118" height="28" rx="5" fill="#f7faf8"/>
  <text x="605" y="554" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="650" fill="#293c3e">73 cells · 73 ft</text>

  <path d="M1040 340H1090 M1040 480H1090 M1080 340V480" fill="none" stroke="#385253" stroke-width="1.5" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>
  <rect x="1086" y="357" width="105" height="44" rx="5" fill="#f7faf8"/>
  <text x="1092" y="375" font-family="system-ui, sans-serif" font-size="14" font-weight="650" fill="#293c3e">14 cells</text>
  <text x="1092" y="393" font-family="system-ui, sans-serif" font-size="12" fill="#48605f">overall</text>

  <!-- Grid coordinates. -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#48605f" text-anchor="middle">
    <text x="100" y="752">0</text><text x="200" y="752">10</text><text x="300" y="752">20</text><text x="400" y="752">30</text><text x="500" y="752">40</text><text x="600" y="752">50</text><text x="700" y="752">60</text><text x="800" y="752">70</text><text x="900" y="752">80</text><text x="1000" y="752">90</text><text x="1060" y="752">96</text>
    <text x="75" y="94">0</text><text x="75" y="194">10</text><text x="75" y="294">20</text><text x="75" y="394">30</text><text x="75" y="494">40</text><text x="75" y="594">50</text><text x="75" y="694">60</text><text x="75" y="734">64</text>
  </g>
  <text x="570" y="777" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#48605f">x coordinate · cells (ft)</text>
  <text x="24" y="410" transform="rotate(-90 24 410)" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#48605f">y coordinate · cells (ft)</text>

  <g font-family="system-ui, sans-serif" fill="#293c3e">
    <rect x="100" y="796" width="16" height="12" rx="2" fill="#acd9dc" stroke="#293c3e"/>
    <text x="124" y="807" font-size="13">open channel</text>
    <path d="M260 802H282" stroke="#293c3e" stroke-width="7"/>
    <text x="292" y="807" font-size="13">bank / wall cells</text>
    <path d="M450 802H476" stroke="#087e83" stroke-width="2" marker-end="url(#flow-arrow)"/>
    <text x="486" y="807" font-size="13">left-to-right test direction</text>
    <text x="780" y="807" font-size="13" fill="#48605f">Angle shown: ~22° to main axis; test 15°, 22°, 30°</text>
  </g>
  <text x="100" y="834" font-family="system-ui, sans-serif" font-size="12" fill="#7b4c37">Proposal for the app's 1-ft grid. The six alternating returns approximate the patent's interleaved pattern; dimensions and angle remain trial variables.</text>
</svg>
