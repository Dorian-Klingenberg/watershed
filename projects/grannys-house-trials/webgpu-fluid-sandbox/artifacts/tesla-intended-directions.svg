 <text x="295" y="110">Split</text>
 <text x="443" y="210" fill="#087db8">Long curved route</text>
 <text x="443" y="235" fill="#087db8">turns back toward</text>
 <text x="443" y="260" fill="#087db8">the arriving stream.</text>
 <text x="36" y="178" fill="#b75b16">Short route</text>
 <text x="443" y="335">Meet with opposing</text>
 <text x="443" y="360">velocity components.</text>
 <text x="300" y="470">Continue into the next</text>
 <text x="300" y="495">alternating hook.</text>
 <text x="345" y="692">Onward</text>
 <text x="32" y="750" font-weight="bold">The return should confront the incoming flow at the junction.</text>
 <text x="32" y="778" font-size="14">This specifies the desired interaction; walls and flow tests must establish it.</text>
